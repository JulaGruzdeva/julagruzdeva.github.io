<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 860" width="1610" height="860" font-family="Inter, 'Onest', system-ui, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".10"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#D9D9DE"/></pattern>
</defs>
<rect width="1610" height="860" fill="#FFFFFF"/>
<text x="60" y="80" font-size="34" font-weight="600" fill="#111111" text-anchor="start">Жизненный цикл уведомления в редакторе</text><text x="60" y="118" font-size="20" font-weight="400" fill="#6B6B6B" text-anchor="start">Одно сообщение на экране, остальные ждут. Ничего не исчезает по таймеру.</text><rect x="60" y="250" width="300" height="140" rx="18" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><text x="84" y="292" font-size="24" font-weight="600" fill="#111111" text-anchor="start">Триггер</text><text x="84" y="324" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">сбой, подсказка</text><text x="84" y="350" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">или ограничение</text><rect x="450" y="250" width="300" height="140" rx="18" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><text x="474" y="292" font-size="24" font-weight="600" fill="#111111" text-anchor="start">Очередь</text><text x="474" y="324" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">ждут стеком под</text><text x="474" y="350" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">активной карточкой</text><rect x="840" y="250" width="300" height="140" rx="18" fill="#111111" stroke="none" stroke-width="1.5"/><text x="864" y="292" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="start">Активное</text><text x="864" y="324" font-size="18" font-weight="400" fill="#C9C9CF" text-anchor="start">видно только одно</text><text x="864" y="350" font-size="18" font-weight="400" fill="#C9C9CF" text-anchor="start">сообщение</text><rect x="1230" y="170" width="320" height="140" rx="18" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><text x="1254" y="212" font-size="24" font-weight="600" fill="#111111" text-anchor="start">Закрыто</text><text x="1254" y="244" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">пользователь закрыл –</text><text x="1254" y="270" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">поднимается следующее</text><rect x="1230" y="360" width="320" height="170" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="1254" y="402" font-size="24" font-weight="600" fill="#111111" text-anchor="start">Снято по условию</text><text x="1254" y="434" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">проблема решена или</text><text x="1254" y="460" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">совет выполнен →</text><text x="1254" y="486" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">короткое «готово»</text><rect x="450" y="560" width="300" height="140" rx="18" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><text x="474" y="602" font-size="24" font-weight="600" fill="#111111" text-anchor="start">Критическая ошибка</text><text x="474" y="634" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">сохранение, публикация,</text><text x="474" y="660" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">стабильность</text><path d="M360,320 L446,320" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M750,320 L836,320" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M1140,290 C1185,290 1185,240 1226,240" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M1140,350 C1185,350 1185,445 1226,445" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#arA)"/><path d="M1390,170 C1390,120 600,120 600,246" stroke="#111111" stroke-width="2" stroke-dasharray="8 7" fill="none" marker-end="url(#ar)"/><text x="995" y="168" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="middle">следующее из очереди</text><path d="M750,630 C820,630 990,600 990,394" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="1000" y="500" font-size="18" font-weight="600" fill="#111111" text-anchor="start">вне очереди</text><rect x="60" y="760" width="1490" height="64" rx="14" fill="#F4F4F5"/><text x="88" y="800" font-size="20" font-weight="400" fill="#111111" text-anchor="start">Новое сообщение не подменяет то, что пользователь читает. Исключение – критические ошибки.</text></svg>