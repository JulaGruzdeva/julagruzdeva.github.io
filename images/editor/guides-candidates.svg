<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 890" width="1610" height="890" font-family="Inter, 'Onest', system-ui, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".10"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#D9D9DE"/></pattern>
</defs>
<rect width="1610" height="890" fill="#FFFFFF"/>
<text x="60" y="80" font-size="34" font-weight="600" fill="#111111" text-anchor="start">Направляющие: какие блоки вообще проверять</text><text x="60" y="118" font-size="20" font-weight="400" fill="#6B6B6B" text-anchor="start">Чтобы редактор не тормозил на больших сценариях, кандидаты отбираются по видимой области.</text><rect x="60" y="160" width="1490" height="650" rx="20" fill="#FAFAFA" stroke="#D4D4D8"/><rect x="60" y="160" width="1490" height="650" rx="20" fill="url(#dots)"/><rect x="264" y="204" width="932" height="552" rx="16" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="300" y="240" width="860" height="480" rx="12" fill="#FFFFFF" fill-opacity=".55" stroke="#111111" stroke-width="2"/><text x="316" y="272" font-size="18" font-weight="600" fill="#111111" text-anchor="start">Видимая область</text><text x="264" y="192" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">запас по краям</text><circle cx="655" cy="503" r="250" fill="#DBE7FF" fill-opacity=".35" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 6"/><g opacity="1"><rect x="330" y="300" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect x="348" y="322" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="348" y="340" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity="1"><rect x="560" y="300" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect x="578" y="322" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="578" y="340" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity="1"><rect x="830" y="430" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect x="848" y="452" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="848" y="470" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity="1"><rect x="360" y="590" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect x="378" y="612" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="378" y="630" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity="1"><rect x="900" y="620" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect x="918" y="642" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="918" y="660" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity=".35"><rect x="66" y="300" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><rect x="84" y="322" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="84" y="340" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity=".35"><rect x="1240" y="420" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><rect x="1258" y="442" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="1258" y="460" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity=".35"><rect x="1300" y="680" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><rect x="1318" y="702" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="1318" y="720" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity=".35"><rect x="66" y="640" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><rect x="84" y="662" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="84" y="680" width="64" height="8" rx="4" fill="#E4E4E7"/></g><g opacity=".35"><rect x="1250" y="200" width="190" height="66" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><rect x="1268" y="222" width="100" height="10" rx="5" fill="#D4D4D8"/><rect x="1268" y="240" width="64" height="8" rx="4" fill="#E4E4E7"/></g><line x1="560" y1="285" x2="560" y2="550" stroke="#2563EB" stroke-width="2"/><g filter="url(#sh)"><rect x="560" y="470" width="190" height="66" rx="12" fill="#2563EB"/></g><rect x="578" y="492" width="100" height="10" rx="5" fill="#FFFFFF" fill-opacity=".9"/><rect x="578" y="510" width="64" height="8" rx="4" fill="#FFFFFF" fill-opacity=".6"/><text x="655" y="570" font-size="17" font-weight="600" fill="#2563EB" text-anchor="middle">перетаскиваемый блок</text><text x="835" y="270" font-size="17" font-weight="600" fill="#2563EB" text-anchor="start">радиус привязки</text><text x="835" y="292" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">пересчитывается под масштаб</text><text x="1240" y="786" font-size="1" font-weight="400" fill="#111111" text-anchor="start"></text><rect x="60" y="828" width="22" height="22" rx="6" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="94" y="846" font-size="18" font-weight="400" fill="#111111" text-anchor="start">кандидат – проверяется для линий</text><rect x="480" y="828" width="22" height="22" rx="6" fill="#fff" stroke="#D4D4D8" stroke-width="1.5" opacity=".5"/><text x="514" y="846" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">вне области – не проверяется</text><line x1="880" y1="839" x2="910" y2="839" stroke="#2563EB" stroke-width="2"/><text x="922" y="846" font-size="18" font-weight="400" fill="#111111" text-anchor="start">направляющая по левому краю</text><rect x="1230" y="828" width="22" height="22" rx="6" fill="none" stroke="#6B6B6B" stroke-dasharray="4 4"/><text x="1264" y="846" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">запас вокруг экрана</text></svg>